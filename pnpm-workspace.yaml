  '@vixt/test-uni>vite': 'catalog:uni'
  '@vue/shared': 'catalog:vue'
  react: 'catalog:react'
  react-dom: 'catalog:react'
  vue: 'catalog:vue'
  vue-router: 'catalog:vue'

peerDependencyRules:
  allowAny:
    - '@dcloudio/types'
    - typescript
    - vite

