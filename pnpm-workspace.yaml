shamefullyHoist: true
dedupeInjectedDeps: false

packages:
  - packages/*
  - playground/*
  - docs

allowBuilds:
  '@parcel/watcher': false
  better-sqlite3: false
  core-js: false
  core-js-pure: false
  esbuild: false
  workerd: false

overrides:
  'vite': 'catalog:vite-plus'
  '@vixt/test-uni>vite': 'catalog:uni'
  '@vue/shared': 'catalog:vue'
  vue: 'catalog:vue'
  vue-router: 'catalog:vue'

peerDependencyRules:
  allowAny:
    - '@dcloudio/types'
    - typescript
    - vite

