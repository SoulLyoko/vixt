shamefullyHoist: true
dedupeInjectedDeps: false

packages:
  - packages/*
  - playground/*
  - docs

allowBuilds:
  '@parcel/watcher': false
  better-sqlite3: false
  core-js: false
  core-js-pure: false
  esbuild: false
  workerd: false

overrides:
