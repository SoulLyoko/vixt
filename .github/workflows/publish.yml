name: NPM Publish

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.18.0
        with:
          node-version: 'lts'
          cache: true

      - name: Build Packages
        run: vpr build

      - name: Publish
        run: pnpm publish --no-git-checks --access public -r

      - name: GitHub release
        run: vpx changelogithub
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Sync npmmirror
        uses: sepveneto/sync-npmmirror-action@v1
        with:
          name: |
            @vixt/cli
            @vixt/core
            @vixt/vue
            @vixt/uni
            @vixt/vitepress
            @vixt/react
            vixt
            create-vixt
